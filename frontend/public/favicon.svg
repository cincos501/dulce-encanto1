<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="50%" stop-color="#851c36" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Cupcake / Cake Base -->
  <path d="M20 38 L23 52 C23.5 54 25 55 27 55 L37 55 C39 55 40.5 54 41 52 L44 38 Z" fill="url(#goldGrad)" />
  
  <!-- Cupcake lines -->
  <path d="M26 39 L27.5 53" stroke="#92400e" stroke-width="1.2" stroke-linecap="round" />
  <path d="M32 39 L32 54" stroke="#92400e" stroke-width="1.2" stroke-linecap="round" />
  <path d="M38 39 L36.5 53" stroke="#92400e" stroke-width="1.2" stroke-linecap="round" />

  <!-- Frosting swirls -->
  <path d="M16 38 C16 33 21 32 24 33 C25 28 31 27 34 30 C36 26 43 27 44 32 C47 33 49 37 47 40 C45 42 19 42 16 38 Z" fill="#ffffff" filter="url(#glow)" />
  
  <!-- Frosting highlight accent -->
  <path d="M23 35 C24 33 28 31 32 32 C36 31 39 33 41 36" fill="none" stroke="#fed7aa" stroke-width="2" stroke-linecap="round" />

  <!-- Sparkling Golden Star on top -->
  <path d="M32 12 L34.2 18.5 L41 19 L35.8 23.2 L37.5 30 L32 26 L26.5 30 L28.2 23.2 L23 19 L29.8 18.5 Z" fill="url(#goldGrad)" filter="url(#glow)" />

  <!-- Mini shine sparkles -->
  <circle cx="47" cy="18" r="1.5" fill="#fde68a" />
  <circle cx="17" cy="24" r="1.2" fill="#fde68a" />
</svg>